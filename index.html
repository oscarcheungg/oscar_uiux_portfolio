    <link rel="icon" type="image/png" href="/frame1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

         browser's own chrome from being darkened by an OS dark preference. -->

    <!-- Inter (variable, so in-between weights like 550 work) carries the

         the homepage's ASCII koi pond; no text uses it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Geist+Mono:wght@600&display=swap"
    />
